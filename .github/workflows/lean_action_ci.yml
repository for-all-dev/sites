name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build-args: "Sites Example sites Test"
      - name: Escape-hatch audit, tests, independent kernel re-check
        run: scripts/check.sh
